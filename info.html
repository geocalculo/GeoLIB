<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>SEA Mining - Proyectos cercanos</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Leaflet -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  />

  <!-- SheetJS (leer Excel) -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #f3f4f6;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
        Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background-color: #0f172a;
      color: #e5e7eb;
      padding: 0.75rem 1.5rem;
      border-bottom: 1px solid #111827;
    }

    .header-title {
      font-size: 1.1rem;
      font-weight: 600;
      margin-bottom: 2px;
    }

    .coords-text {
      font-size: 0.9rem;
      color: #cbd5f5;
    }

    main {
      max-width: 1000px;
      margin: 1.5rem auto 2rem;
      padding: 0 1rem;
      width: 100%;
    }

    .small-text {
      font-size: 0.9rem;
      color: #4b5563;
    }

    .card {
      background: #ffffff;
      border-radius: 0.75rem;
      box-shadow: 0 10px 15px -3px rgb(15 23 42 / 0.1);
      padding: 1.25rem;
    }

    .map-wrapper {
      width: 100%;
      aspect-ratio: 1 / 1;
      border-radius: 0.75rem;
      overflow: hidden;
      margin-top: 0.75rem;
    }

    #mapOverview {
      width: 100%;
      height: 100%;
    }

    .estado-legend {
      margin-top: 0.75rem;
      font-size: 0.85rem;
      color: #4b5563;
    }

    .pill {
      display: inline-block;
      padding: 0.1rem 0.5rem;
      border-radius: 999px;
      font-size: 0.75rem;
      font-weight: 500;
      margin-right: 0.5rem;
    }

    .pill-aprobado {
      background: #bbf7d0;
      color: #166534;
    }

    .pill-rechazado {
      background: #fecaca;
      color: #991b1b;
    }

    .pill-eval {
      background: #fee2e2;
      color: #b45309;
    }

    .pill-otro {
      background: #e5e7eb;
      color: #374151;
    }
  </style>
</head>
<body>
  <header>
    <div class="header-title">SEA Mining - Proyectos cercanos</div>
    <div id="coordsDisplay" class="coords-text">
      Coordenadas consulta: lat ?, lng ?
    </div>
    <div id="sectoresDisplay" class="coords-text">
      Sectores productivos: Todos
    </div>
  </header>

  <main>
    <section class="card">
      <h2 class="h5 mb-1">Distribución espacial de los proyectos</h2>
      <p id="radioTexto" class="small-text">
        Radio de análisis alrededor del punto consultado: -
      </p>

      <div class="map-wrapper">
        <div id="mapOverview"></div>
      </div>

      <div class="estado-legend">
        <strong>Leyenda:</strong>
        <span class="pill pill-aprobado">Aprobado (10 más cercanos)</span>
        <span class="pill pill-rechazado">Rechazado</span>
        <span class="pill pill-eval">En evaluación</span>
        <span class="pill pill-otro">Otros estados</span>
      </div>
    </section>
  </main>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    // ===============================
    // Parámetros URL
    // ===============================
    const urlParams = new URLSearchParams(window.location.search);
    const consultaLat = parseFloat(urlParams.get("lat")) || -27.5;
    const consultaLng = parseFloat(urlParams.get("lng")) || -70.25;
    const zoomInicial = parseInt(urlParams.get("z")) || 8;

    const secParam = urlParams.get("sec");
    let sectoresFiltro = [];
    if (secParam && secParam.trim() !== "") {
      sectoresFiltro = secParam
        .split(",")
        .map(s => s.trim())
        .filter(s => s.length > 0);
    }

    document.getElementById("coordsDisplay").textContent =
      `Coordenadas consulta: lat ${consultaLat.toFixed(6)}, lng ${consultaLng.toFixed(6)}`;

    if (!sectoresFiltro.length) {
      document.getElementById("sectoresDisplay").textContent =
        "Sectores productivos: Todos";
    } else {
      document.getElementById("sectoresDisplay").textContent =
        "Sectores productivos: " + sectoresFiltro.join(", ");
    }

    const DATA_XLSX_URL = "capas/SEA_Atacama_Proyectos.xlsx";

    let proyectosOriginal = [];
    let proyectosEnRadio = [];
    let top10Aprobados = [];
    let mapOverview;
    let capaProyectosOverview;
    let circuloRadio;

    // ===============================
    // Helpers
    // ===============================
    function normalizeHeader(h) {
      return String(h || "")
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .toLowerCase();
    }

    function normalizeSimple(value) {
      return String(value || "")
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .toLowerCase()
        .replace(/\s+/g, " ")
        .trim();
    }

    function parseCoord(value) {
      if (value === null || value === undefined) return null;
      let s = String(value).trim();
      if (!s) return null;
      s = s.replace(",", ".");
      const n = Number(s);
      return isNaN(n) ? null : n;
    }

    function normalizarEstado(estadoRaw) {
      if (!estadoRaw) return "Sin información";
      let e = normalizeSimple(estadoRaw);
      if (e.includes("rechaz")) return "Rechazado";
      if (e.includes("aprob") || e.includes("favorabl")) return "Aprobado";
      if (e.includes("calific") || e.includes("evalu")) return "En evaluación";
      return String(estadoRaw).trim();
    }

    function haversineKm(lat1, lon1, lat2, lon2) {
      const R = 6371;
      const toRad = deg => (deg * Math.PI) / 180;
      const dLat = toRad(lat2 - lat1);
      const dLon = toRad(lon2 - lon1);
      const a =
        Math.sin(dLat / 2) ** 2 +
        Math.cos(toRad(lat1)) *
          Math.cos(toRad(lat2)) *
          Math.sin(dLon / 2) ** 2;
      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
      return R * c;
    }

    // ===============================
    // Mapa
    // ===============================
    function initMap() {
      mapOverview = L.map("mapOverview").setView(
        [consultaLat, consultaLng],
        zoomInicial
      );

      L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
        maxZoom: 18,
        attribution: "&copy; OpenStreetMap",
      }).addTo(mapOverview);

      L.circleMarker([consultaLat, consultaLng], {
        radius: 6,
        color: "#2563eb",
        weight: 2,
        fillColor: "#3b82f6",
        fillOpacity: 0.9,
      })
        .bindPopup("Punto consultado")
        .addTo(mapOverview);
    }

    function dibujarOverview(radioKm) {
      if (!mapOverview) return;

      if (capaProyectosOverview) capaProyectosOverview.remove();
      if (circuloRadio) circuloRadio.remove();

      const grupo = L.layerGroup();

      proyectosEnRadio.forEach(p => {
        if (p.lat == null || p.lon == null) return;

        const estadoNorm = normalizarEstado(p.estado_actual);

        let options;
        if (p.esTop10Aprobado) {
          options = {
            radius: 6,
            color: "#166534",
            weight: 2,
            fillColor: "#22c55e",
            fillOpacity: 0.95,
          };
        } else if (estadoNorm === "Rechazado") {
          options = {
            radius: 5,
            color: "#991b1b",
            weight: 2,
            fillColor: "#ef4444",
            fillOpacity: 0.9,
          };
        } else if (estadoNorm === "En evaluación") {
          options = {
            radius: 5,
            color: "#b45309",
            weight: 2,
            fillColor: "#f97316",
            fillOpacity: 0.9,
          };
        } else {
          options = {
            radius: 4,
            color: "#4b5563",
            weight: 1.5,
            fillColor: "#9ca3af",
            fillOpacity: 0.8,
          };
        }

        let popupHtml =
          `<strong>${p.nombre_proyecto || "Proyecto"}</strong><br>` +
          `Estado: ${estadoNorm}<br>` +
          `Sector: ${p.sector_productivo || "Sin información"}<br>` +
          `Distancia: ${p.dist_km.toFixed(2)} km`;

        L.circleMarker([p.lat, p.lon], options)
          .bindPopup(popupHtml)
          .addTo(grupo);
      });

      capaProyectosOverview = grupo.addTo(mapOverview);

      if (radioKm > 0) {
        const radioMetros = radioKm * 1000;

        // Dibujar círculo
        circuloRadio = L.circle([consultaLat, consultaLng], {
          radius: radioMetros,
          color: "#38bdf8",
          weight: 1.5,
          fillOpacity: 0.05,
        }).addTo(mapOverview);

        // ---- ZOOM EXTENT: ajustar al círculo + puntos ----
        try {
          const bounds = circuloRadio.getBounds();

          // incluir punto consultado y proyectos, por si están muy hacia un lado
          bounds.extend([consultaLat, consultaLng]);
          proyectosEnRadio.forEach(p => {
            if (p.lat != null && p.lon != null) {
              bounds.extend([p.lat, p.lon]);
            }
          });

          mapOverview.fitBounds(bounds, { padding: [30, 30] });
        } catch (err) {
          console.warn("No se pudo ajustar el zoom con fitBounds:", err);
        }

        document.getElementById("radioTexto").textContent =
          `Radio de análisis alrededor del punto consultado: ` +
          `${radioMetros.toFixed(0)} m (${radioKm.toFixed(2)} km).`;
      } else {
        document.getElementById("radioTexto").textContent =
          "No se encontraron proyectos aprobados alrededor del punto consultado para los sectores seleccionados.";
      }
    }

    // ===============================
    // Cargar Excel
    // ===============================
    async function cargarDatos() {
      try {
        const resp = await fetch(DATA_XLSX_URL);
        if (!resp.ok) return;

        const data = new Uint8Array(await resp.arrayBuffer());
        const workbook = XLSX.read(data, { type: "array" });

        const sheet = workbook.Sheets[workbook.SheetNames[0]];
        const arr = XLSX.utils.sheet_to_json(sheet, { header: 1, defval: null });

        const headers = arr[0];
        const filas = arr.slice(1);

        let idxLat = -1,
          idxLon = -1,
          idxEstado = -1,
          idxNombre = -1,
          idxSector = -1;

        headers.forEach((h, i) => {
          const n = normalizeHeader(h);
          if (n.includes("latitud") && idxLat === -1) idxLat = i;
          if (n.includes("longitud") && idxLon === -1) idxLon = i;
          if (n.includes("estado") && !n.includes("fecha") && idxEstado === -1)
            idxEstado = i;
          if (n.includes("nombre") && n.includes("proyecto") && idxNombre === -1)
            idxNombre = i;
          if (n.includes("sector") && idxSector === -1) idxSector = i;
        });

        const filtroSectoresNorm = new Set(
          sectoresFiltro.map(s => normalizeSimple(s))
        );

        proyectosOriginal = filas
          .map(row => {
            const lat = idxLat >= 0 ? parseCoord(row[idxLat]) : null;
            const lon = idxLon >= 0 ? parseCoord(row[idxLon]) : null;

            const estado_actual = idxEstado >= 0 ? row[idxEstado] : null;
            const nombre_proyecto = idxNombre >= 0 ? row[idxNombre] : null;
            const sector_productivo = idxSector >= 0 ? row[idxSector] : null;

            if (lat == null || lon == null || isNaN(lat) || isNaN(lon)) return null;

            // Filtro por sector
            if (sectoresFiltro.length > 0 && idxSector >= 0) {
              const sectorNorm = normalizeSimple(sector_productivo);
              if (!filtroSectoresNorm.has(sectorNorm)) return null;
            }

            const dist_km = haversineKm(consultaLat, consultaLng, lat, lon);

            return {
              lat,
              lon,
              estado_actual,
              nombre_proyecto,
              sector_productivo,
              dist_km,
              esTop10Aprobado: false,
            };
          })
          .filter(p => p !== null);

        // Top 10 aprobados
        const aprobados = proyectosOriginal
          .filter(p => normalizarEstado(p.estado_actual) === "Aprobado")
          .sort((a, b) => a.dist_km - b.dist_km);

        top10Aprobados = aprobados.slice(0, 10);
        const radioKm =
          top10Aprobados.length > 0
            ? top10Aprobados[top10Aprobados.length - 1].dist_km
            : 0;

        const topSet = new Set(top10Aprobados);
        proyectosOriginal.forEach(p => {
          if (topSet.has(p)) p.esTop10Aprobado = true;
        });

        proyectosEnRadio =
          radioKm > 0
            ? proyectosOriginal.filter(p => p.dist_km <= radioKm)
            : [];

        dibujarOverview(radioKm);
      } catch (err) {
        console.error("Error cargando el Excel:", err);
      }
    }

    // ===============================
    // Inicio
    // ===============================
    initMap();
    cargarDatos();
  </script>
</body>
</html>
