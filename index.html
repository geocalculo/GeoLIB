<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>SEA Mining - Proyectos cercanos a un punto</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Leaflet CSS -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  />

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
        Roboto, Helvetica, Arial, sans-serif;
      background: #020617;
      color: #e5e7eb;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background: #020617;
      border-bottom: 1px solid #111827;
      padding: 12px 16px 10px 16px;
    }

    .header-inner {
      max-width: 1200px;
      margin: 0 auto;
      text-align: center;
    }

    .title {
      font-size: 1.15rem;
      font-weight: 600;
      letter-spacing: 0.03em;
    }

    .subtitle {
      margin-top: 4px;
      font-size: 0.9rem;
      color: #9ca3af;
    }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }

    #map {
      flex: 1;
      width: 100%;
      min-height: 400px;
      background: #000;
    }

    footer {
      background: #020617;
      border-top: 1px solid #111827;
      padding: 6px 12px;
      font-size: 0.75rem;
      color: #6b7280;
      text-align: right;
    }

    a {
      color: #38bdf8;
    }

    a:hover {
      color: #0ea5e9;
    }
  </style>
</head>
<body>
  <header>
    <div class="header-inner">
      <div class="title">SEA Mining - Proyectos cercanos a un punto</div>
      <div class="subtitle">
        Haz clic en cualquier parte del mapa para generar el reporte de proyectos más cercanos
        (el reporte se abrirá en una pestaña nueva).
      </div>
    </div>
  </header>

  <main>
    <div id="map"></div>
  </main>

  <footer>
    GeoLIB / GeoIPT &copy; <span id="year"></span>
  </footer>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    // Año en el footer
    document.getElementById("year").textContent = new Date().getFullYear();

    // Mapa centrado en Copiapó
    const centroCopiapo = [-27.366, -70.333];
    const map = L.map("map").setView(centroCopiapo, 8);

    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      maxZoom: 19,
      attribution:
        '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
    }).addTo(map);

    // Click en el mapa => abrir info.html en pestaña nueva con lat, lng, z
    map.on("click", function (e) {
      const lat  = e.latlng.lat.toFixed(6);
      const lng  = e.latlng.lng.toFixed(6);
      const zoom = map.getZoom();

      const url = `info.html?lat=${lat}&lng=${lng}&z=${zoom}`;

      // Importante: abrir en pestaña nueva
      window.open(url, "_blank");
    });
  </script>
</body>
</html>
