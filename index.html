<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>SEA Mining - Proyectos cercanos a un punto</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Leaflet CSS -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  />

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
        Roboto, Helvetica, Arial, sans-serif;
      background: #020617;
      color: #e5e7eb;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background: #020617;
      border-bottom: 1px solid #111827;
      padding: 8px 16px;
      text-align: center;
    }

    header h1 {
      font-size: 1.1rem;
      font-weight: 600;
      margin-bottom: 2px;
    }

    header p {
      font-size: 0.85rem;
      color: #9ca3af;
    }

    main {
      flex: 1;
      display: flex;
      min-height: 0;
    }

    #map {
      flex: 1;
      width: 100%;
      min-height: 400px;
    }

    .sidebar {
      position: absolute;
      top: 80px;
      left: 12px;
      z-index: 1000;
    }

    .sidebar-card {
      background: #020617ee;
      border-radius: 0.75rem;
      box-shadow: 0 10px 15px -3px rgb(15 23 42 / 0.6);
      padding: 10px 12px;
      width: 210px;
      color: #e5e7eb;
      border: 1px solid #1f2937;
      font-size: 0.8rem;
    }

    .sidebar-card h2 {
      font-size: 0.85rem;
      margin-bottom: 2px;
      font-weight: 600;
    }

    .sidebar-card p {
      font-size: 0.7rem;
      color: #9ca3af;
      margin-bottom: 6px;
    }

    .sector-list {
      max-height: 220px;
      overflow-y: auto;
      padding-right: 4px;
      margin-top: 4px;
    }

    .sector-item {
      display: flex;
      align-items: center;
      margin-bottom: 2px;
    }

    .sector-item input {
      margin-right: 6px;
    }

    footer {
      background: #020617;
      border-top: 1px solid #111827;
      padding: 6px 16px;
      font-size: 0.75rem;
      color: #6b7280;
      text-align: right;
    }

    a {
      color: #60a5fa;
    }

    a:hover {
      color: #93c5fd;
    }

    @media (max-width: 640px) {
      .sidebar-card {
        width: 180px;
        font-size: 0.75rem;
      }
    }
  </style>
</head>
<body>
  <header>
    <h1>SEA Mining - Proyectos cercanos a un punto</h1>
    <p>Haz clic en cualquier parte del mapa para generar el reporte de proyectos más cercanos (el reporte se abrirá en una pestaña nueva).</p>
  </header>

  <main>
    <div id="map"></div>

    <div class="sidebar">
      <div class="sidebar-card">
        <h2>Sectores productivos</h2>
        <p>Marca uno o varios sectores. Si no seleccionas ninguno, se consideran todos.</p>

        <div class="sector-list">
          <div class="sector-item">
            <input type="checkbox" id="sec-todos" checked />
            <label for="sec-todos"><strong>Todos</strong></label>
          </div>

          <div class="sector-item">
            <input type="checkbox" class="sector-check" id="sec-mineria" value="Minería" checked />
            <label for="sec-mineria">Minería</label>
          </div>

          <div class="sector-item">
            <input type="checkbox" class="sector-check" id="sec-energia" value="Energía" checked />
            <label for="sec-energia">Energía</label>
          </div>

          <div class="sector-item">
            <input type="checkbox" class="sector-check" id="sec-infra" value="Infraestructura" checked />
            <label for="sec-infra">Infraestructura</label>
          </div>

          <div class="sector-item">
            <input type="checkbox" class="sector-check" id="sec-industrial" value="Industrial" checked />
            <label for="sec-industrial">Industrial</label>
          </div>

          <div class="sector-item">
            <input type="checkbox" class="sector-check" id="sec-agro" value="Agropecuario" checked />
            <label for="sec-agro">Agropecuario</label>
          </div>

          <div class="sector-item">
            <input type="checkbox" class="sector-check" id="sec-forestal" value="Forestal" checked />
            <label for="sec-forestal">Forestal</label>
          </div>

          <div class="sector-item">
            <input type="checkbox" class="sector-check" id="sec-pesca" value="Pesca y Acuicultura" checked />
            <label for="sec-pesca">Pesca y Acuicultura</label>
          </div>

          <div class="sector-item">
            <input type="checkbox" class="sector-check" id="sec-residuos" value="Residuos" checked />
            <label for="sec-residuos">Residuos</label>
          </div>
        </div>
      </div>
    </div>
  </main>

  <footer>
    <span id="year"></span> &copy; GeoLIB / GeoIPT
  </footer>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    // Año en el footer
    document.getElementById("year").textContent = new Date().getFullYear();

    // =======================
    // MAPA BASE HÍBRIDO
    // =======================
    const centroCopiapo = [-27.366, -70.333];
    const map = L.map("map").setView(centroCopiapo, 8);

    // Satélite ESRI (fondo)
    const esriSat = L.tileLayer(
      "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",
      {
        attribution: "Tiles © Esri",
        maxZoom: 19,
        opacity: 1.0
      }
    ).addTo(map);

    // Calles OSM semitransparentes (encima)
    const osm = L.tileLayer(
      "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
      {
        attribution:
          '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
        maxZoom: 19,
        opacity: 0.6
      }
    ).addTo(map);

    // Control de capas (opcional)
    L.control
      .layers(
        { "Satélite (Esri)": esriSat },
        { "Calles (OSM semitransparente)": osm },
        { collapsed: false }
      )
      .addTo(map);

    // =======================
    // LÓGICA DE SECTORES
    // =======================
    const chkTodos = document.getElementById("sec-todos");
    const sectorChecks = Array.from(document.querySelectorAll(".sector-check"));

    function actualizarEstadoTodos() {
      const anyUnchecked = sectorChecks.some(chk => !chk.checked);
      chkTodos.checked = !anyUnchecked;
    }

    chkTodos.addEventListener("change", () => {
      const marcar = chkTodos.checked;
      sectorChecks.forEach(chk => (chk.checked = marcar));
    });

    sectorChecks.forEach(chk => {
      chk.addEventListener("change", actualizarEstadoTodos);
    });

    function obtenerSectoresSeleccionados() {
      const activos = sectorChecks
        .filter(chk => chk.checked)
        .map(chk => chk.value);

      // Si Todos está marcado o no hay ninguno marcado => sin filtro
      if (chkTodos.checked || activos.length === 0) {
        return [];
      }
      return activos;
    }

    // =======================
    // CLICK EN EL MAPA
    // =======================
    map.on("click", function (e) {
      const lat  = e.latlng.lat.toFixed(6);
      const lng  = e.latlng.lng.toFixed(6);
      const zoom = map.getZoom();

      const sectores = obtenerSectoresSeleccionados();
      let url = `info.html?lat=${lat}&lng=${lng}&z=${zoom}`;

      if (sectores.length > 0) {
        const secParam = encodeURIComponent(sectores.join(","));
        url += `&sec=${secParam}`;
      }

      window.open(url, "_blank");
    });
  </script>
</body>
</html>
