      if (!l) {
        window.lintrk = function(a,b){window.lintrk.q.push([a,b]);};

  <title>SEA proyectos</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <link rel="stylesheet" href="css/app.css" />
</head>
<body>
  <div class="app-shell">
    <header class="app-header">
      <div class="app-header__content">
        <div class="app-branding">
          <h1>Proyectos</h1>
          <p class="app-subtitle">Explorador GeoEVA</p>
        </div>

        <div class="app-toolbar">
          <div class="region-selector-container">
            <label for="region-select" class="region-label">📍 Región</label>
            <select id="region-select" class="region-select">
              <option value="">Cargando regiones...</option>
            </select>
          </div>
        </div>
      </div>

      <div class="mobile-summary" id="mobileSummary" aria-label="Resumen por estado">
        <button class="ms-card ms-aprobados" type="button">
          <span class="ms-label">🟢 Aprobados</span>
          <span class="ms-value" data-key="aprobados">—</span>
        </button>
        <button class="ms-card ms-calificacion" type="button">
          <span class="ms-label">🟡 En calificación</span>
          <span class="ms-value" data-key="calificacion">—</span>
        </button>
        <button class="ms-card ms-rechazados" type="button">
          <span class="ms-label">🔴 Rechazados</span>
          <span class="ms-value" data-key="rechazados">—</span>
        </button>
      </div>
    </header>

    <main class="app-main">
      <section class="map-section" aria-label="Mapa principal GeoEVA">
        <div class="map-stage">
          <div id="map" class="map-main"></div>
          <div id="desktop-map-hint" class="map-hint map-hint--desktop" aria-hidden="true">
            Haz clic en el mapa para abrir el análisis del punto.
          </div>
          <div id="mobile-map-hint" class="map-hint map-hint--mobile" aria-hidden="true">
            Toca el mapa para abrir el análisis del punto.
          </div>
        </div>
      </section>

      <aside class="geoeva-side-banner" aria-label="Banner promocional">
        <iframe
          src="banners/banner_01_geoipt.html"
          title="Banner GeoIPT"
          loading="lazy"
          referrerpolicy="strict-origin-when-cross-origin">
        </iframe>
      </aside>
    </main>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script type="module" src="js/app/index.js?v=4"></script>
</body>
</html>
