<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>SEA Mining - Proyectos cercanos a un punto</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Leaflet CSS -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  />

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
        Roboto, Helvetica, Arial, sans-serif;
      background: #020617;
      color: #e5e7eb;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background: #020617;
      border-bottom: 1px solid #111827;
      padding: 12px 16px 10px 16px;
    }

    .header-inner {
      max-width: 1200px;
      margin: 0 auto;
      text-align: center;
    }

    .title {
      font-size: 1.15rem;
      font-weight: 600;
      letter-spacing: 0.03em;
    }

    .subtitle {
      margin-top: 4px;
      font-size: 0.9rem;
      color: #9ca3af;
    }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }

    .map-container {
      position: relative;
      flex: 1;
      width: 100%;
      min-height: 400px;
      background: #000;
    }

    #map {
      width: 100%;
      height: 100%;
    }

    footer {
      background: #020617;
      border-top: 1px solid #111827;
      padding: 6px 12px;
      font-size: 0.75rem;
      color: #6b7280;
      text-align: right;
    }

    a {
      color: #38bdf8;
    }

    a:hover {
      color: #0ea5e9;
    }

    /* Panel de filtros de sectores */
    .controls-panel {
      position: absolute;
      top: 16px;
      left: 16px;
      background: rgba(15, 23, 42, 0.96);
      border-radius: 0.75rem;
      padding: 10px 12px;
      border: 1px solid #1f2937;
      box-shadow: 0 10px 25px rgba(15, 23, 42, 0.6);
      max-width: 280px;
      font-size: 0.8rem;
      z-index: 800;
    }

    .controls-title {
      font-weight: 600;
      font-size: 0.85rem;
      margin-bottom: 4px;
    }

    .controls-help {
      font-size: 0.72rem;
      color: #9ca3af;
      margin-bottom: 6px;
    }

    .sector-list {
      max-height: 160px;
      overflow-y: auto;
      padding-right: 2px;
    }

    .sector-item {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 3px;
    }

    .sector-item input[type="checkbox"] {
      accent-color: #38bdf8;
      width: 13px;
      height: 13px;
    }

    .sector-item span {
      font-size: 0.8rem;
      color: #e5e7eb;
    }

    @media (max-width: 640px) {
      .controls-panel {
        top: 10px;
        left: 50%;
        transform: translateX(-50%);
        width: calc(100% - 24px);
        max-width: 360px;
      }
    }
  </style>
</head>
<body>
  <header>
    <div class="header-inner">
      <div class="title">SEA Mining - Proyectos cercanos a un punto</div>
      <div class="subtitle">
        Haz clic en cualquier parte del mapa para generar el reporte de proyectos más cercanos
        (el reporte se abrirá en una pestaña nueva).
      </div>
    </div>
  </header>

  <main>
    <div class="map-container">
      <div id="map"></div>

      <!-- Panel de selección de sectores productivos -->
      <div class="controls-panel">
        <div class="controls-title">Sectores productivos</div>
        <div class="controls-help">
          Marca uno o varios sectores. Si no seleccionas ninguno, se considerarán todos.
        </div>
        <div class="sector-list">
          <!--
            IMPORTANTE:
            Los valores (value="...") deberían coincidir con los textos que vienen
            en la columna "Sector productivo" del Excel, para que luego info.html
            pueda filtrar correctamente.
          -->
          <label class="sector-item">
            <input type="checkbox" class="sector-checkbox" value="Energía" checked />
            <span>Energía</span>
          </label>
          <label class="sector-item">
            <input type="checkbox" class="sector-checkbox" value="Minería" checked />
            <span>Minería</span>
          </label>
          <label class="sector-item">
            <input type="checkbox" class="sector-checkbox" value="Infraestructura" checked />
            <span>Infraestructura</span>
          </label>
          <label class="sector-item">
            <input type="checkbox" class="sector-checkbox" value="Industrial" checked />
            <span>Industrial</span>
          </label>
          <label class="sector-item">
            <input type="checkbox" class="sector-checkbox" value="Agropecuario" checked />
            <span>Agropecuario</span>
          </label>
          <label class="sector-item">
            <input type="checkbox" class="sector-checkbox" value="Forestal" checked />
            <span>Forestal</span>
          </label>
          <label class="sector-item">
            <input type="checkbox" class="sector-checkbox" value="Pesca y Acuicultura" checked />
            <span>Pesca y Acuicultura</span>
          </label>
          <label class="sector-item">
            <input type="checkbox" class="sector-checkbox" value="Residuos" checked />
            <span>Residuos</span>
          </label>
          <label class="sector-item">
            <input type="checkbox" class="sector-checkbox" value="Otros" checked />
            <span>Otros</span>
          </label>
        </div>
      </div>
    </div>
  </main>

  <footer>
    GeoLIB / GeoIPT &copy; <span id="year"></span>
  </footer>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    // Año en el footer
    document.getElementById("year").textContent = new Date().getFullYear();

    // Mapa centrado en Copiapó
    const centroCopiapo = [-27.366, -70.333];
    const map = L.map("map").setView(centroCopiapo, 8);

    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      maxZoom: 19,
      attribution:
        '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
    }).addTo(map);

    // Función para obtener sectores seleccionados
    function getSectoresSeleccionados() {
      const checkboxes = document.querySelectorAll(".sector-checkbox");
      const seleccionados = [];

      checkboxes.forEach(cb => {
        if (cb.checked) {
          seleccionados.push(cb.value);
        }
      });

      // Regla:
      // - Si no hay ninguno marcado => se asume TODOS (devolvemos array vacío para no filtrar)
      // - Si están todos marcados => también se asume TODOS (array vacío)
      if (seleccionados.length === 0 || seleccionados.length === checkboxes.length) {
        return [];
      }

      return seleccionados;
    }

    // Click en el mapa => abrir info.html en pestaña nueva con lat, lng, z y sec (si aplica)
    map.on("click", function (e) {
      const lat  = e.latlng.lat.toFixed(6);
      const lng  = e.latlng.lng.toFixed(6);
      const zoom = map.getZoom();

      const sectores = getSectoresSeleccionados();
      let extra = "";

      if (sectores.length > 0) {
        // Lista separada por comas, URL encoded
        extra = "&sec=" + encodeURIComponent(sectores.join(","));
      }

      const url = `info.html?lat=${lat}&lng=${lng}&z=${zoom}${extra}`;

      // Abrir en pestaña nueva
      window.open(url, "_blank");
    });
  </script>
</body>
</html>
