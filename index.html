<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>SEA Mining - Explorador de proyectos</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Fuente -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Leaflet -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

  <!-- CSS -->
  <link rel="stylesheet" href="css/index-fullheight.css" />
</head>

<body>
<div class="app-wrapper">

  <!-- ================================================= -->
  <!-- HEADER -->
  <!-- ================================================= -->
  <header class="app-header">
    <div class="app-header-inner">
      <h1>SEA Mining - Explorador</h1>

      <div class="region-selector-container">
        <label for="region-select" class="region-label">📍 Región:</label>
        <select id="region-select" class="region-select">
          <option value="">Cargando regiones...</option>
        </select>
      </div>
    </div>
    <!-- ===== RESUMEN MOVIL (solo mobile por CSS) ===== -->
    <div class="mobile-summary" id="mobileSummary" aria-label="Resumen por estado">
      <button class="ms-card ms-aprobados" id="msAprobados" type="button">
        <div class="ms-label">🟢 Aprobados</div>
        <div class="ms-value" id="msAprobadosVal">—</div>
      </button>

      <button class="ms-card ms-calificacion" id="msCalificacion" type="button">
        <div class="ms-label">🟡 En calificación</div>
        <div class="ms-value" id="msCalificacionVal">—</div>
      </button>

      <button class="ms-card ms-rechazados" id="msRechazados" type="button">
        <div class="ms-label">🔴 Rechazados</div>
        <div class="ms-value" id="msRechazadosVal">—</div>
      </button>
    </div>

    <button
      id="togglePanelBtn"
      class="panel-toggle-btn"
      type="button"
      aria-label="Abrir configuración"
    >
      ☰ Configuración
    </button>
  </header>

  <!-- ================================================= -->
  <!-- MAIN -->
  <!-- ================================================= -->
  <main>
    <div class="layout">

      <!-- PANEL -->
      <section class="panel" id="configPanel">
        <div class="panel-scroll">

          <div class="panel-section">
            <div class="badge badge-resumen">📊 RESUMEN</div>

            <div id="bboxInfo" class="bbox-info">
              Proyectos en pantalla: —
            </div>

            <div id="summaryTableContainer" class="summary-table-container"></div>
            <div id="sectorTableContainer" class="summary-table-container"></div>
          </div>

          <div class="panel-section">

            <div class="field-block">
              <label class="field-label">Modo de selección</label>
              <div class="radio-group">
                <label class="chip">
                  <input type="radio" checked />
                  <span>Por Proximidad</span>
                </label>
              </div>
            </div>

            <div class="field-block">
              <label class="field-label">Proyectos más cercanos</label>
              <input
                type="range"
                id="nSlider"
                min="5"
                max="20"
                step="1"
                value="10"
                class="range-input"
              />
              <div class="hint">
                N aprobados: <strong><span id="nValue">10</span></strong>
              </div>
            </div>

            <span class="hint">
              El detalle se abre tocando el mapa.
            </span>

          </div>
        </div>
      </section>

      <div id="panelBackdrop" class="panel-backdrop"></div>

      <!-- MAPA -->
      <section class="map-section">
        <div id="map" class="map-main"></div>
      </section>

    </div>
  </main>

  <!-- ================================================= -->
  <!-- SCRIPTS -->
  <!-- ================================================= -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script type="module" src="js/app/index.js"></script>

</div>
</body>
</html>
