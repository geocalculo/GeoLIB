<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />

  <!-- Google Tag Manager -->
  <script>
    (function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':
    new Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],
    j=d.createElement(s),dl=l!='dataLayer'?'&l='+l:'';j.async=true;j.src=
    'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);
    })(window,document,'script','dataLayer','GTM-PM7NMT4G');
  </script>
  <!-- End Google Tag Manager -->

  <title>SEA proyectos</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <link rel="stylesheet" href="css/app.css" />
</head>
<body>
  <!-- Google Tag Manager (noscript) -->
  <noscript>
    <iframe
      src="https://www.googletagmanager.com/ns.html?id=GTM-PM7NMT4G"
      height="0"
      width="0"
      style="display:none;visibility:hidden"></iframe>
  </noscript>
  <!-- End Google Tag Manager (noscript) -->

  <div id="loading-overlay" class="loading-overlay" aria-live="polite" aria-busy="true">
    <div class="loading-card">
      <div class="loading-ring-wrap">
        <div class="loading-ring"></div>
        <div id="loading-percent" class="loading-percent">0%</div>
      </div>
      <div id="loading-text" class="loading-text">Cargando mapa...</div>
    </div>
  </div>

  <div class="app-shell">
    <header class="app-header">
      <div class="app-header__content">
        <div class="app-branding">
          <h1>Proyectos</h1>
          <p class="app-subtitle">Explorador GeoEVA</p>
        </div>

        <div class="app-toolbar">
          <div class="region-selector-container">
            <label for="region-select" class="region-label">📍 Región</label>
            <select id="region-select" class="region-select">
              <option value="">Cargando regiones...</option>
            </select>
          </div>
        </div>
      </div>

      <div class="mobile-summary" id="mobileSummary" aria-label="Resumen por estado">
        <button class="ms-card ms-aprobados" type="button">
          <span class="ms-label">🟢 Aprobados</span>
          <span class="ms-value" data-key="aprobados">—</span>
        </button>
        <button class="ms-card ms-calificacion" type="button">
          <span class="ms-label">🟡 En calificación</span>
          <span class="ms-value" data-key="calificacion">—</span>
        </button>
        <button class="ms-card ms-rechazados" type="button">
          <span class="ms-label">🔴 Rechazados</span>
          <span class="ms-value" data-key="rechazados">—</span>
        </button>
      </div>
    </header>

    <main class="app-main">

      <!-- IZQUIERDA: GeoNEMO -->
      <aside class="geoeva-side-banner" aria-label="Banner promocional GeoNEMO">
        <iframe
          src="banners/banner_GeoNEMO.html"
          title="Banner GeoNEMO"
          loading="lazy"
          referrerpolicy="strict-origin-when-cross-origin">
        </iframe>
      </aside>

      <!-- CENTRO: MAPA -->
      <section class="map-section" aria-label="Mapa principal GeoEVA">
        <div class="map-stage">
          <div id="map" class="map-main"></div>

          <div id="desktop-map-hint" class="map-hint map-hint--desktop" aria-hidden="true">
            Haz clic en el mapa para abrir el análisis del punto.
          </div>

          <div id="mobile-map-hint" class="map-hint map-hint--mobile" aria-hidden="true">
            Toca el mapa para abrir el análisis del punto.
          </div>
        </div>
      </section>

      <!-- DERECHA: GeoIPT -->
      <aside class="geoeva-side-banner" aria-label="Banner promocional GeoIPT">
        <iframe
          src="banners/banner_01_geoipt.html"
          title="Banner GeoIPT"
          loading="lazy"
          referrerpolicy="strict-origin-when-cross-origin">
        </iframe>
      </aside>

    </main>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script type="module" src="js/app/index.js?v=4"></script>

  <div id="map-hint-cursor">
    Haz clic en el mapa y descubre proyectos + su permisología
  </div>

  <!-- Contador de visitas -->
  <div id="visitor-counter" style="
    position:fixed;
    bottom:10px;
    right:12px;
    font-size:12px;
    font-family:Inter, Arial, sans-serif;
    color:#9ca3af;
    background:rgba(0,0,0,0.6);
    padding:6px 10px;
    border-radius:8px;
    backdrop-filter: blur(6px);
    z-index:9999;
  ">
    Visitas: 
    <img src="https://api.visitorbadge.io/api/visitors?path=geoeva.cl&countColor=%2322c55e"
        alt="contador visitas"
        style="vertical-align:middle;">
  </div>

</body>
</html>
