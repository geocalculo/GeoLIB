<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>SEA Mining - Consulta de proyectos cercanos</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Leaflet CSS -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin=""
  />

  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: system-ui, sans-serif;
      background: #0b1120;
      color: #e5e7eb;
    }

    header {
      padding: 16px;
      background: #020617;
      border-bottom: 1px solid #1e293b;
      text-align: center;
    }

    h1 {
      margin: 0;
      font-size: 1.2rem;
    }

    .subtitle {
      font-size: 0.85rem;
      color: #94a3b8;
    }

    #map {
      width: 100%;
      height: calc(100vh - 90px);
      background: #000;
    }
  </style>
</head>

<body>
  <header>
    <h1>SEA Mining - Proyectos cercanos a un punto</h1>
    <div class="subtitle">
      Haz clic en cualquier parte del mapa para consultar los 10 proyectos más cercanos.
    </div>
  </header>

  <div id="map"></div>

  <!-- Leaflet JS -->
  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+t1r0WZBbCi2Ee0E="
    crossorigin=""
  ></script>

  <script>
    // Ubicación central: Copiapó
    const center = [-27.3668, -70.3322];

    const map = L.map("map", {
      zoomControl: true,
    }).setView(center, 9);

    // Fondo de mapa
    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      maxZoom: 19,
      attribution: "&copy; OpenStreetMap contributors",
    }).addTo(map);

    // Marcador temporal del punto consultado
    let marker = null;

    map.on("click", (e) => {
      const { lat, lng } = e.latlng;

      if (marker) marker.setLatLng(e.latlng);
      else marker = L.marker(e.latlng).addTo(map);

      marker.bindPopup(
        `Consulta:<br>Lat: ${lat.toFixed(6)}<br>Lon: ${lng.toFixed(6)}`
      ).openPopup();

      // Abrir reporte info.html en nueva pestaña
      const url = `info.html?lat=${lat.toFixed(6)}&lon=${lng.toFixed(6)}`;
      window.open(url, "_blank");
    });
  </script>
</body>
</html>
