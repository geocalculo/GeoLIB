<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>SEA Mining - Proyectos cercanos a un punto</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Leaflet CSS -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  />

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
        Roboto, Helvetica, Arial, sans-serif;
      background: #020617;
      color: #e5e7eb;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background: #020617;
      border-bottom: 1px solid #111827;
      padding: 12px 16px 10px 16px;
    }

    .header-inner {
      max-width: 1200px;
      margin: 0 auto;
      text-align: center;
    }

    .title {
      font-size: 1.15rem;
      font-weight: 600;
      letter-spacing: 0.03em;
    }

    .subtitle {
      margin-top: 4px;
      font-size: 0.9rem;
      color: #9ca3af;
    }

    /* Barra superior estilo GeoIPT */
    .top-bar {
      width: 100%;
      background: #0f172a;
      border-bottom: 1px solid #1e293b;
      padding: 8px 16px;
      display: flex;
      align-items: center;
      gap: 16px;
      z-index: 800;
    }

    .top-bar label {
      font-size: 0.85rem;
      color: #cbd5e1;
      font-weight: 500;
    }

    /* Dropdown estilos */
    .dropdown {
      position: relative;
      display: inline-block;
    }

    .dropdown-button {
      background: #1e293b;
      border: 1px solid #334155;
      padding: 6px 12px;
      border-radius: 6px;
      color: #e2e8f0;
      cursor: pointer;
      font-size: 0.85rem;
      min-width: 220px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .dropdown-content {
      display: none;
      position: absolute;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 8px 12px;
      min-width: 230px;
      margin-top: 4px;
      z-index: 1000;
      max-height: 230px;
      overflow-y: auto;
      box-shadow: 0 10px 25px rgba(0,0,0,0.4);
    }

    .dropdown.open .dropdown-content {
      display: block;
    }

    .dropdown-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 4px 0;
      color: #e2e8f0;
      font-size: 0.82rem;
    }

    .dropdown-item input {
      accent-color: #38bdf8;
    }

    main {
      flex: 1;
      width: 100%;
      display: flex;
      flex-direction: column;
    }

    #map {
      width: 100%;
      height: calc(100vh - 160px); /* header + barra superior */
      background: #000;
    }

    footer {
      background: #020617;
      border-top: 1px solid #111827;
      padding: 6px 12px;
      font-size: 0.75rem;
      color: #6b7280;
      text-align: right;
    }

    a {
      color: #38bdf8;
    }

    a:hover {
      color: #0ea5e9;
    }
  </style>
</head>

<body>
  <!-- HEADER -->
  <header>
    <div class="header-inner">
      <div class="title">SEA Mining - Proyectos cercanos a un punto</div>
      <div class="subtitle">
        Haz clic en cualquier parte del mapa para generar el reporte de proyectos más cercanos
        (el reporte se abrirá en una pestaña nueva).
      </div>
    </div>
  </header>

  <!-- BARRA SUPERIOR -->
  <div class="top-bar">
    <label for="sectorDropdown">Sectores productivos:</label>

    <div class="dropdown" id="sectorDropdown">
      <div class="dropdown-button">
        Seleccionar sectores
        <span>▼</span>
      </div>

      <div class="dropdown-content">
        <label class="dropdown-item">
          <input type="checkbox" id="chkTodos" class="sector-master" checked> Todos
        </label>
        <label class="dropdown-item">
          <input type="checkbox" class="sector-checkbox" value="Energía" checked> Energía
        </label>
        <label class="dropdown-item">
          <input type="checkbox" class="sector-checkbox" value="Minería" checked> Minería
        </label>
        <label class="dropdown-item">
          <input type="checkbox" class="sector-checkbox" value="Infraestructura" checked> Infraestructura
        </label>
        <label class="dropdown-item">
          <input type="checkbox" class="sector-checkbox" value="Industrial" checked> Industrial
        </label>
        <label class="dropdown-item">
          <input type="checkbox" class="sector-checkbox" value="Agropecuario" checked> Agropecuario
        </label>
        <label class="dropdown-item">
          <input type="checkbox" class="sector-checkbox" value="Forestal" checked> Forestal
        </label>
        <label class="dropdown-item">
          <input type="checkbox" class="sector-checkbox" value="Pesca y Acuicultura" checked> Pesca y Acuicultura
        </label>
        <label class="dropdown-item">
          <input type="checkbox" class="sector-checkbox" value="Residuos" checked> Residuos
        </label>
      </div>
    </div>
  </div>

  <!-- MAPA -->
  <main>
    <div id="map"></div>
  </main>

  <footer>
    GeoLIB / GeoIPT © <span id="year"></span>
  </footer>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    // Año en el footer
    document.getElementById("year").textContent = new Date().getFullYear();

    // --- Dropdown ---
    const dropdown = document.getElementById("sectorDropdown");
    const dropdownButton = dropdown.querySelector(".dropdown-button");

    dropdownButton.addEventListener("click", () => {
      dropdown.classList.toggle("open");
    });

    // Cerrar al hacer clic fuera
    document.addEventListener("click", function (event) {
      if (!dropdown.contains(event.target)) {
        dropdown.classList.remove("open");
      }
    });

    const chkTodos = document.getElementById("chkTodos");
    const sectorChecks = document.querySelectorAll(".sector-checkbox");

    // Cuando el usuario marca "Todos"
    chkTodos.addEventListener("change", () => {
      const estado = chkTodos.checked;
      sectorChecks.forEach(cb => cb.checked = estado);
    });

    // Cuando el usuario marca/desmarca sectores individuales
    sectorChecks.forEach(cb => {
      cb.addEventListener("change", () => {
        const total = sectorChecks.length;
        const marcados = [...sectorChecks].filter(x => x.checked).length;
        chkTodos.checked = (marcados === total);
      });
    });

    // Obtener sectores seleccionados para enviar al reporte
    function getSectoresSeleccionados() {
      // Si "Todos" está marcado => todos los sectores (no filtramos)
      if (chkTodos.checked) return [];

      const sectores = [];
      sectorChecks.forEach(cb => {
        if (cb.checked) sectores.push(cb.value);
      });

      // Si no hay ninguno marcado, también interpretamos como "todos"
      if (sectores.length === 0) return [];

      return sectores;
    }

    // --- Mapa ---
    const centroCopiapo = [-27.366, -70.333];
    const map = L.map("map").setView(centroCopiapo, 8);

    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      maxZoom: 19,
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
    }).addTo(map);

    // Click en el mapa => abrir info.html con lat, lng, z y sec
    map.on("click", function (e) {
      const lat  = e.latlng.lat.toFixed(6);
      const lng  = e.latlng.lng.toFixed(6);
      const zoom = map.getZoom();

      const sectores = getSectoresSeleccionados();
      let extra = "";

      if (sectores.length > 0) {
        extra = "&sec=" + encodeURIComponent(sectores.join(","));
      }

      const url = `info.html?lat=${lat}&lng=${lng}&z=${zoom}${extra}`;
      window.open(url, "_blank");
    });
  </script>
</body>
</html>
