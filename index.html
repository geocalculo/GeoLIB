<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>GeoEVA – Explorador de Proyectos SEIA</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Fuente -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Leaflet -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

  <!-- CSS -->
  <link rel="stylesheet" href="css/index-fullheight.css" />
</head>

<body>
<div class="app-wrapper">

  <!-- ================= HEADER ================= -->
  <header class="app-header">
    <div class="app-header-inner">
      <h1 class="app-title">
        GeoEVA
        <span>Explorador de Proyectos SEIA</span>
      </h1>

      <div class="region-selector-container">
        <label for="region-select" class="region-label">📍 Región</label>
        <select id="region-select" class="region-select">
          <option value="">Cargando regiones…</option>
        </select>
      </div>
    </div>

    <!-- Resumen móvil -->
    <div class="mobile-summary" id="mobileSummary">
      <div class="ms-card ms-aprobados">
        <div class="ms-label">🟢 Aprobados</div>
        <div class="ms-value" data-key="aprobados">—</div>
      </div>
      <div class="ms-card ms-calificacion">
        <div class="ms-label">🟡 En calificación</div>
        <div class="ms-value" data-key="calificacion">—</div>
      </div>
      <div class="ms-card ms-rechazados">
        <div class="ms-label">🔴 Rechazados</div>
        <div class="ms-value" data-key="rechazados">—</div>
      </div>
    </div>
  </header>

  <!-- ================= MAIN ================= -->
  <main class="app-main">

    <!-- MAPA -->
    <section class="map-section">
      <div id="map" class="map-main"></div>
    </section>

    <!-- LISTA DE PROYECTOS (ÚNICA: DESKTOP + MOBILE) -->
    <aside id="projectList" class="project-list">
      <!-- JS renderiza aquí -->
    </aside>

  </main>

  <!-- ================= SCRIPTS ================= -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script type="module" src="js/app/index.js"></script>

</div>
</body>
</html>
