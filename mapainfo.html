<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>SEA Mining - Detalle de proximidad</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  
  <!-- Custom CSS -->
  <link rel="stylesheet" href="css/mapainfo.css" />
</head>

<body>
  <div class="page-wrapper">
    <header>
      <h1>SEA Mining – Detalle de proximidad</h1>
      <p>Proyectos dentro del radio definido desde el punto consultado.</p>
    </header>

    <div class="info-bar">
      <div class="info-row">
        <span id="coordsLabel">Punto: —</span>
        <span id="modoLabel">Modo: —</span>
        <span id="radioLabel">Radio: —</span>
      </div>
      <div class="info-row">
        <span id="countLabel">Resumen: —</span>
        <span id="invLabel">Inversión: —</span>
      </div>
    </div>

    <div class="map-square">
      <div id="map"></div>
    </div>

    <div id="chartsSection" class="charts-wrapper">
      <h2 class="charts-title">Análisis gráfico de la inversión</h2>
      <div id="chartsGrid" class="charts-grid"></div>
    </div>
  </div>

  <!-- External Libraries -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
  
  <!-- Custom Scripts -->
  <script src="js/graficos-enhanced.js"></script>
  <script src="js/mapainfo.js"></script>
</body>
</html>
