<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>SEA Mining - Detalle de proximidad</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Leaflet CSS -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  />

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
        Roboto, Helvetica, Arial, sans-serif;
      background-color: #f3f4f6;
      color: #111827;
      min-height: 100vh;
    }

    /* Contenedor general: 70% de ancho, centrado */
    .page-wrapper {
      width: 70%;
      max-width: 1400px;
      margin: 0 auto 2rem auto;
    }

    @media (max-width: 900px) {
      .page-wrapper {
        width: 95%;
      }
    }

    header {
      background: #020617;
      color: #e5e7eb;
      padding: 0.75rem 1.25rem;
      border-radius: 14px;
      margin-top: 1rem;
    }

    header h1 {
      font-size: 1.2rem;
      margin-bottom: 0.2rem;
    }

    header p {
      font-size: 0.85rem;
      color: #9ca3af;
    }

    /* Cinta superior */
    .info-bar {
      margin-top: 1rem;
      padding: 0.6rem 1.25rem;
      font-size: 0.85rem;
      background: #e5e7eb;
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
    }

    .info-row {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
    }

    /* Mapa cuadrado 1:1 */
    .map-square {
      width: 100%;
      aspect-ratio: 1 / 1;
      position: relative;
      margin-top: 1rem;
    }

    .map-square > #map {
      position: absolute;
      inset: 0;
      width: 100% !important;
      height: 100% !important;
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(15, 23, 42, 0.18);
    }

    /* Fallback por si algún navegador ignora aspect-ratio */
    #map {
      min-height: 350px;
    }

    /* Leyenda */
    .legend {
      position: absolute;
      bottom: 14px;
      left: 14px;
      background: rgba(255, 255, 255, 0.9);
      padding: 6px 8px;
      border-radius: 6px;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.2);
      font-size: 0.78rem;
      line-height: 1.3;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 2px;
    }

    .legend-color {
      width: 10px;
      height: 10px;
      border-radius: 999px;
    }

    /* ==============================
       Sección de gráficos parametrizados
       ============================== */

    .charts-wrapper {
      margin-top: 2rem;
      padding-bottom: 3rem;
    }

    .charts-title {
      font-size: 1.3rem;
      margin-bottom: 1rem;
      color: #0f172a;
    }

    .charts-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.5rem;
    }

    .chart-card {
      background: #ffffff;
      border-radius: 14px;
      padding: 1rem 1.2rem;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.12);
    }

    .chart-card h3 {
      margin-bottom: 0.5rem;
      font-size: 1rem;
    }

    .plotly-chart {
      width: 100%;
      height: 260px;
    }

    @media (max-width: 900px) {
      .charts-grid {
        grid-template-columns: 1fr;
      }
    }

    /* ===========================
       Labels con Polylines
       =========================== */

    .project-label-icon {
      border: none !important;
      background: transparent !important;
    }

    .project-label {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      padding: 0.4rem 0.7rem;
      border-radius: 8px;
      font-size: 0.75rem;
      font-weight: 600;
      white-space: nowrap;
      box-shadow: 0 3px 12px rgba(0, 0, 0, 0.2);
      border: 1px solid #e5e7eb;
      max-width: 180px;
      overflow: hidden;
      text-overflow: ellipsis;
      color: #111827;
    }

    /* Borde de color según estado */
    .project-label-aprobado {
      border-left: 3px solid #16a34a;
    }

    .project-label-calificacion {
      border-left: 3px solid #ea580c;
    }

    .project-label-rechazado {
      border-left: 3px solid #dc2626;
    }

    /* Responsive: labels más pequeños en móvil */
    @media (max-width: 768px) {
      .project-label {
        font-size: 0.7rem;
        padding: 0.3rem 0.5rem;
        max-width: 140px;
      }
    }
  </style>
</head>

<body>
  <div class="page-wrapper">
    <!-- HEADER -->
    <header>
      <h1>SEA Mining – Detalle de proximidad</h1>
      <p>Proyectos dentro del radio definido desde el punto consultado.</p>
    </header>

    <!-- CINTA SUPERIOR -->
    <div class="info-bar">
      <div class="info-row">
        <span id="coordsLabel">Punto: —</span>
        <span id="modoLabel">Modo: —</span>
        <span id="radioLabel">Radio: —</span>
      </div>
      <div class="info-row">
        <span id="countLabel">Resumen: —</span>
        <span id="invLabel">Inversión: —</span>
      </div>
    </div>

    <!-- MAPA CUADRADO -->
    <div class="map-square">
      <div id="map"></div>
    </div>

    <!-- ============================= -->
    <!-- SECCIÓN DE GRÁFICOS PARAMETRIZADOS -->
    <!-- ============================= -->
    <div id="chartsSection" class="charts-wrapper">
      <h2 class="charts-title">Análisis gráfico de la inversión</h2>

      <!-- Aquí se inyectan automáticamente las tarjetas de gráficos 
           según la configuración en js/graficos.js (CHARTS_CONFIG) -->
      <div id="chartsGrid" class="charts-grid"></div>
    </div>
  </div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- SheetJS para leer el Excel nacional -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

  <!-- Plotly.js -->
  <script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>

  <!-- Lógica de gráficos parametrizados -->
  <script src="js/graficos.js"></script>

  <script>
    const DATA_XLSX_URL = "capas/nacional.xlsx";
    let globalParams = null;

    function parseCoord(value) {
      if (value === null || value === undefined) return null;
      let s = String(value).trim();
      if (!s) return null;

      s = s.replace(/\s/g, "");

      if (s.indexOf(",") >= 0 && s.indexOf(".") >= 0) {
        if (s.lastIndexOf(",") > s.lastIndexOf(".")) {
          s = s.replace(/\./g, "").replace(",", ".");
        } else {
          s = s.replace(/,/g, "");
        }
      } else if (s.indexOf(",") >= 0) {
        s = s.replace(",", ".");
      }

      const num = Number(s);
      return Number.isFinite(num) ? num : null;
    }

    function distanceKm(lat1, lon1, lat2, lon2) {
      const R = 6371;
      const rad = Math.PI / 180;
      const dLat = (lat2 - lat1) * rad;
      const dLon = (lon2 - lon1) * rad;
      const a =
        Math.sin(dLat / 2) ** 2 +
        Math.cos(lat1 * rad) *
          Math.cos(lat2 * rad) *
          Math.sin(dLon / 2) ** 2;
      return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
    }

    function formatMMU(value) {
      if (!Number.isFinite(value) || value <= 0) return "—";
      return (
        value.toLocaleString("es-CL", {
          minimumFractionDigits: 1,
          maximumFractionDigits: 1,
        }) + " MMU$"
      );
    }

    // Lectura de nacional.xlsx por columnas
    async function loadExcelData() {
      const resp = await fetch(DATA_XLSX_URL);
      const buf = await resp.arrayBuffer();
      const wb = XLSX.read(buf, { type: "array" });

      const sheetName = wb.SheetNames[0];
      const ws = wb.Sheets[sheetName];

      const json = XLSX.utils.sheet_to_json(ws, { header: 1, defval: null });
      if (!json.length) return [];

      const rows = json.slice(1);

      const COL_NOMBRE = 0;
      const COL_WEB    = 1;
      const COL_TIPO   = 2;
      const COL_REGION = 3;
      const COL_INV    = 9;
      const COL_FECHA  = 10;
      const COL_ESTADO = 11;
      const COL_SECTOR = 13;
      const COL_LAT    = 14;
      const COL_LON    = 15;
      const COL_ANEXOS = 16;
      const COL_ANIO   = 17;

      const data = [];

      for (const row of rows) {
        if (!row || row.length === 0) continue;

        const lat = parseCoord(row[COL_LAT]);
        const lon = parseCoord(row[COL_LON]);
        if (lat === null || lon === null) continue;

        const invNum = parseCoord(row[COL_INV]);
        const anioVal = row[COL_ANIO];
        const anioNum =
          anioVal !== null && anioVal !== undefined && anioVal !== ""
            ? parseInt(anioVal, 10)
            : null;

        data.push({
          lat,
          lon,
          nombre: row[COL_NOMBRE] || "",
          web: row[COL_WEB] || "",
          tipo: row[COL_TIPO] || "",
          region: row[COL_REGION] || "",
          inversion: invNum,
          fechaIngreso: row[COL_FECHA] || null,
          estado: row[COL_ESTADO] || "",
          sector: row[COL_SECTOR] || "",
          anexos: row[COL_ANEXOS] || "",
          anio: anioNum,
        });
      }

      return data;
    }

    function ajustarZoomCirculo(map, circle) {
      const size = map.getSize();
      const minSide = Math.min(size.x, size.y);
      const paddingPx = minSide * 0.20;

      map.fitBounds(circle.getBounds(), {
        padding: [paddingPx, paddingPx]
      });
    }

    document.addEventListener("DOMContentLoaded", async () => {
      const params = new URLSearchParams(window.location.search);
      globalParams = params;

      const lat = parseFloat(params.get("lat"));
      const lng = parseFloat(params.get("lng"));
      const modo = params.get("modo") || "radio";
      const radioParam = parseFloat(params.get("radio")) || 10;
      const nParam = parseInt(params.get("n") || "10", 10);
      const sectoresParam = params.get("sectores") || "";
      const sectoresFiltro = sectoresParam
        ? sectoresParam.split("|").filter(Boolean)
        : [];

      const coordsLabel = document.getElementById("coordsLabel");
      const modoLabel   = document.getElementById("modoLabel");
      const radioLabel  = document.getElementById("radioLabel");
      const countLabel  = document.getElementById("countLabel");
      const invLabel    = document.getElementById("invLabel");

      coordsLabel.textContent = `Punto: ${lat.toFixed(5)}, ${lng.toFixed(5)}`;
      modoLabel.textContent =
        modo === "proximidad"
          ? `Modo: Proximidad (N=${nParam} aprobados)`
          : `Modo: Radio (R=${radioParam} km)`;

      // MAPA
      const map = L.map("map", {
        center: [lat, lng],
        zoom: 10,
        minZoom: 4,
      });

      L.tileLayer(
        "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
        {
          opacity: 1.0,
          maxZoom: 19,
          attribution: "&copy; OpenStreetMap contributors"
        }
      ).addTo(map);

      L.tileLayer(
        "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",
        {
          opacity: 0.10,
          maxZoom: 19,
        }
      ).addTo(map);

      L.control.scale().addTo(map);

      // Punto exacto del clic
      L.circleMarker([lat, lng], {
        radius: 6,
        color: "#1d4ed8",
        weight: 2,
        fillColor: "#1d4ed8",
        fillOpacity: 1,
      }).addTo(map);

      const markersLayer = L.layerGroup().addTo(map);

      // Leyenda
      const legend = L.control({ position: "bottomleft" });
      legend.onAdd = function () {
        const div = L.DomUtil.create("div", "legend");
        div.innerHTML = `
          <div class="legend-item">
            <span class="legend-color" style="background:#16a34a;"></span> Aprobado
          </div>
          <div class="legend-item">
            <span class="legend-color" style="background:#ea580c;"></span> En calificación / evaluación
          </div>
          <div class="legend-item">
            <span class="legend-color" style="background:#dc2626;"></span> Rechazado
          </div>
          <div class="legend-item">
            <span class="legend-color" style="background:#6b7280;"></span> Otros estados
          </div>
        `;
        return div;
      };
      legend.addTo(map);

      let proyectos;
      try {
        proyectos = await loadExcelData();
      } catch (err) {
        console.error("Error cargando nacional.xlsx en mapainfo.html:", err);
        radioLabel.textContent = "Radio: —";
        countLabel.textContent = "Error al cargar datos de proyectos para este detalle.";
        invLabel.textContent = "Inversión: —";
        return;
      }

      // Filtro por sectores
      if (sectoresFiltro.length) {
        proyectos = proyectos.filter((p) => {
          const sectorLower = (p.sector || "").toLowerCase();
          return sectoresFiltro.some(
            (s) => sectorLower === s.trim().toLowerCase()
          );
        });
      }

      // Añadir distancia al punto consultado
      const todosConDist = proyectos.map((p) => ({
        ...p,
        distKm: distanceKm(lat, lng, p.lat, p.lon),
      }));

      let radioKm = radioParam;
      let topNSet = new Set();

      if (modo === "proximidad") {
        const aprobados = todosConDist.filter((p) =>
          (p.estado || "").toLowerCase().includes("aprob")
        );
        aprobados.sort((a, b) => a.distKm - b.distKm);

        const aprobTopN = aprobados.slice(0, nParam);

        if (aprobTopN.length) {
          radioKm = aprobTopN[aprobTopN.length - 1].distKm;
          topNSet = new Set(
            aprobTopN.map(
              (p) => `${p.lat}|${p.lon}|${(p.nombre || "").trim()}`
            )
          );
        } else {
          radioKm = radioParam;
        }
      }

      // Círculo de análisis
      const circle = L.circle([lat, lng], {
        radius: radioKm * 1000,
        color: "#1d4ed8",
        weight: 3,
        fill: false,
        fillOpacity: 0,
        interactive: false,
      }).addTo(map);

      ajustarZoomCirculo(map, circle);

      map.on("resize", () => {
        ajustarZoomCirculo(map, circle);
      });

      // Proyectos dentro del radio
      const dentro = todosConDist.filter((p) => p.distKm <= radioKm);

      let resumenAprob = 0;
      let resumenCalif = 0;
      let resumenRech  = 0;
      let resumenOtros = 0;

      let invAprob = 0;
      let invCalif = 0;
      let invRech  = 0;
      let invOtros = 0;

      // ✨ Almacenar info de labels para reorganización
      const labelsInfo = [];

      dentro.forEach((p, index) => {
        const estadoL = (p.estado || "").toLowerCase();
        const key = `${p.lat}|${p.lon}|${(p.nombre || "").trim()}`;

        let color = "#6b7280";
        let bucket = "Otros";

        if (modo === "proximidad" && topNSet.has(key)) {
          color = "#16a34a";
          bucket = "Aprob";
        } else if (estadoL.includes("rech")) {
          color = "#dc2626";
          bucket = "Rech";
        } else if (estadoL.includes("calif") || estadoL.includes("eval")) {
          color = "#ea580c";
          bucket = "Calif";
        } else if (estadoL.includes("aprob")) {
          color = "#16a34a";
          bucket = "Aprob";
        }

        if (bucket === "Aprob") resumenAprob++;
        else if (bucket === "Calif") resumenCalif++;
        else if (bucket === "Rech") resumenRech++;
        else resumenOtros++;

        if (Number.isFinite(p.inversion)) {
          if (bucket === "Aprob") invAprob += p.inversion;
          else if (bucket === "Calif") invCalif += p.inversion;
          else if (bucket === "Rech") invRech += p.inversion;
          else invOtros += p.inversion;
        }

        // Marcador del proyecto
        const m = L.circleMarker([p.lat, p.lon], {
          radius: 4,
          color,
          weight: 1,
          fillColor: color,
          fillOpacity: 0.8,
        });

        m.bindPopup(`
          <strong>${p.nombre || "Proyecto sin nombre"}</strong><br/>
          <b>Tipo:</b> ${p.tipo || "—"}<br/>
          <b>Sector:</b> ${p.sector || "—"}<br/>
          <b>Inversión:</b> ${formatMMU(p.inversion)}<br/>
          <b>Estado:</b> ${p.estado || "—"}<br/>
          <b>Distancia:</b> ${p.distKm.toFixed(2)} km<br/><br/>
          <b>Expediente:</b> ${
            p.web
              ? `<a href="${p.web}" target="_blank">Abrir expediente</a>`
              : "—"
          }<br/>
          <b>Anexos:</b> ${
            p.anexos
              ? `<a href="${p.anexos}" target="_blank">Abrir anexos</a>`
              : "—"
          }
        `);

        m.addTo(markersLayer);

        // ✨ AGREGAR LABEL CON POLYLINE solo para proyectos importantes
        const esImportante = bucket === 'Aprob' || (modo === 'proximidad' && topNSet.has(key));

        if (esImportante) {
          labelsInfo.push({
            proyecto: p,
            marker: m,
            color: color,
            bucket: bucket,
            index: index
          });
        }
      });

      // ✨ FUNCIÓN PARA CREAR/ACTUALIZAR LABELS CON POLYLINES
      function actualizarLabelsConPolylines() {
        // Limpiar labels anteriores
        markersLayer.eachLayer((layer) => {
          if (layer.options && layer.options.esLabel) {
            markersLayer.removeLayer(layer);
          }
        });

        const zoom = map.getZoom();
        
        // Ajustar distancia del label según zoom
        let offsetDist = 0.008;
        if (zoom < 10) offsetDist = 0.015;
        else if (zoom < 12) offsetDist = 0.010;
        else if (zoom >= 13) offsetDist = 0.005;

        labelsInfo.forEach((info, idx) => {
          const p = info.proyecto;
          
          // Calcular posición del label (distribución radial)
          const angulo = (idx * (360 / labelsInfo.length)) * (Math.PI / 180);
          const labelLat = p.lat + (offsetDist * Math.cos(angulo));
          const labelLng = p.lon + (offsetDist * Math.sin(angulo));

          // Línea conectora (polyline)
          const polyline = L.polyline(
            [[p.lat, p.lon], [labelLat, labelLng]],
            {
              color: info.color,
              weight: 1.5,
              opacity: 0.7,
              dashArray: '3, 6',
              esLabel: true
            }
          ).addTo(markersLayer);

          // Clase CSS según bucket
          let labelClass = 'project-label';
          if (info.bucket === 'Aprob') labelClass += ' project-label-aprobado';
          else if (info.bucket === 'Calif') labelClass += ' project-label-calificacion';
          else if (info.bucket === 'Rech') labelClass += ' project-label-rechazado';

          // Acortar nombre si es muy largo
          const nombreMostrar = (p.nombre || "Sin nombre").length > 30
            ? (p.nombre || "Sin nombre").substring(0, 27) + '...'
            : (p.nombre || "Sin nombre");

          // Label como DivIcon
          const labelIcon = L.divIcon({
            className: 'project-label-icon',
            html: `<div class="${labelClass}">${nombreMostrar}</div>`,
            iconSize: null,
            iconAnchor: [0, 10]
          });

          // Marcador del label
          const labelMarker = L.marker([labelLat, labelLng], { 
            icon: labelIcon,
            interactive: false,
            esLabel: true
          }).addTo(markersLayer);
        });
      }

      // ✨ CREAR LABELS INICIALES
      actualizarLabelsConPolylines();

      // ✨ ACTUALIZAR LABELS AL CAMBIAR ZOOM
      map.on('zoomend', () => {
        actualizarLabelsConPolylines();
      });

      // Actualizar cinta
      radioLabel.textContent = `Radio: ${radioKm.toFixed(1)} km`;
      countLabel.textContent =
        `Resumen – Aprob: ${resumenAprob} | Calif: ${resumenCalif} | ` +
        `Rech: ${resumenRech} | Otros: ${resumenOtros}`;
      invLabel.textContent =
        `Inversión – Aprob: ${formatMMU(invAprob)} | ` +
        `Calif: ${formatMMU(invCalif)} | ` +
        `Rech: ${formatMMU(invRech)} | ` +
        `Otros: ${formatMMU(invOtros)}`;

      // ==============================
      // Datos para los gráficos parametrizados
      // ==============================
      const chartData = dentro.map((p) => {
        const tipoRaw = (p.tipo || "").toUpperCase();
        let tipoNorm = "Otros";
        if (tipoRaw.includes("EIA")) tipoNorm = "EIA";
        else if (tipoRaw.includes("DIA")) tipoNorm = "DIA";

        return {
          tipo: tipoNorm,
          estado: p.estado || "Otros",
          sector: p.sector || "Sin sector",
          region: p.region || "Sin región",
          inversionMm: p.inversion || 0,
          anio:
            p.anio !== null && p.anio !== undefined && p.anio !== ""
              ? parseInt(p.anio, 10)
              : null,
          distKm: p.distKm,
        };
      });

      // Llamar a los gráficos
      if (typeof window.initCharts === "function") {
        window.initCharts(chartData);
      } else {
        console.warn("initCharts(chartData) no está definido. Revisa js/graficos.js");
      }
    });
  </script>
</body>
</html>
