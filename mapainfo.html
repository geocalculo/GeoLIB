<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>SEA Mining - Mapa detalle</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Leaflet CSS -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  />

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
        Roboto, Helvetica, Arial, sans-serif;
      background-color: #f3f4f6;
      color: #111827;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background: #020617;
      color: #e5e7eb;
      padding: 0.75rem 1.25rem;
    }

    header h1 {
      font-size: 1.1rem;
      margin-bottom: 0.2rem;
    }

    header p {
      font-size: 0.85rem;
      color: #9ca3af;
    }

    /* Cinta superior */
    .info-bar {
      padding: 0.4rem 1.25rem;
      font-size: 0.85rem;
      background: #e5e7eb;
      border-bottom: 1px solid #d1d5db;
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
    }

    .info-row {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
    }

    .info-row span {
      margin-right: 0.5rem;
    }

    #map {
      flex: 1;
      width: 100%;
    }

    @media (min-width: 900px) {
      #map {
        height: calc(100vh - 80px);
      }
    }

    .legend {
      position: absolute;
      bottom: 14px;
      left: 14px;
      background: rgba(255, 255, 255, 0.9);
      padding: 6px 8px;
      border-radius: 6px;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.2);
      font-size: 0.78rem;
      line-height: 1.3;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 4px;
      margin-bottom: 2px;
    }

    .legend-color {
      width: 10px;
      height: 10px;
      border-radius: 999px;
    }
  </style>
</head>
<body>
  <header>
    <h1>SEA Mining – Detalle de proximidad</h1>
    <p>Proyectos dentro del radio definido desde el punto consultado.</p>
  </header>

  <!-- CINTA ORDENADA EN DOS FILAS -->
  <div class="info-bar">
    <div class="info-row">
      <span id="coordsLabel">Punto: —</span>
      <span id="modoLabel">Modo: —</span>
      <span id="radioLabel">Radio: —</span>
    </div>
    <div class="info-row">
      <span id="countLabel">Resumen: —</span>
      <span id="invLabel">Inversión: —</span>
    </div>
  </div>

  <div id="map"></div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- SheetJS para leer el Excel nacional -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

  <script>
    const DATA_XLSX_URL = "capas/nacional.xlsx";
    let globalParams = null; // para reconsulta

    function parseCoord(value) {
      if (value === null || value === undefined) return null;
      let s = String(value).trim();
      if (!s) return null;

      s = s.replace(/\s/g, "");

      if (s.indexOf(",") >= 0 && s.indexOf(".") >= 0) {
        if (s.lastIndexOf(",") > s.lastIndexOf(".")) {
          s = s.replace(/\./g, "").replace(",", ".");
        } else {
          s = s.replace(/,/g, "");
        }
      } else if (s.indexOf(",") >= 0) {
        s = s.replace(",", ".");
      }

      const num = Number(s);
      return Number.isFinite(num) ? num : null;
    }

    function distanceKm(lat1, lon1, lat2, lon2) {
      const R = 6371;
      const rad = Math.PI / 180;
      const dLat = (lat2 - lat1) * rad;
      const dLon = (lon2 - lon1) * rad;
      const a =
        Math.sin(dLat / 2) * Math.sin(dLat / 2) +
        Math.cos(lat1 * rad) *
          Math.cos(lat2 * rad) *
          Math.sin(dLon / 2) *
          Math.sin(dLon / 2);
      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
      return R * c;
    }

    // Formato de inversión en MMU$
    function formatMMU(value) {
      if (!Number.isFinite(value) || value <= 0) return "—";
      return (
        value.toLocaleString("es-CL", {
          minimumFractionDigits: 1,
          maximumFractionDigits: 1,
        }) + " MMU$"
      );
    }

    // Carga de nacional.xlsx (por letras de columna)
    async function loadExcelData() {
      const resp = await fetch(DATA_XLSX_URL);
      const buf = await resp.arrayBuffer();
      const wb = XLSX.read(buf, { type: "array" });

      const sheetName = wb.SheetNames[0];
      const ws = wb.Sheets[sheetName];

      const json = XLSX.utils.sheet_to_json(ws, { header: 1, defval: null });
      if (!json.length) return [];

      // Fila 0 = encabezados, la saltamos
      const rows = json.slice(1);

      // Índices FIJOS por letra de columna
      const COL_NOMBRE = 0;   // A
      const COL_WEB = 1;      // B
      const COL_TIPO = 2;     // C
      const COL_REGION = 3;   // D
      const COL_INV = 9;      // J
      const COL_ESTADO = 11;  // L
      const COL_SECTOR = 13;  // N
      const COL_LAT = 14;     // O
      const COL_LON = 15;     // P
      const COL_ANEXOS = 16;  // Q

      const data = [];

      for (const row of rows) {
        if (!row || row.length === 0) continue;

        const lat = parseCoord(row[COL_LAT]);
        const lon = parseCoord(row[COL_LON]);
        if (lat === null || lon === null) continue;

        const invNum = parseCoord(row[COL_INV]); // inversión como número

        data.push({
          lat,
          lon,
          nombre: row[COL_NOMBRE] || "",
          web: row[COL_WEB] || "",
          tipo: row[COL_TIPO] || "",
          region: row[COL_REGION] || "",
          estado: row[COL_ESTADO] || "",
          sector: row[COL_SECTOR] || "",
          inversion: invNum,
          anexos: row[COL_ANEXOS] || ""
        });
      }

      return data;
    }

    document.addEventListener("DOMContentLoaded", async () => {
      const params = new URLSearchParams(window.location.search);
      globalParams = params; // para usar en abrirReconsulta

      const lat = parseFloat(params.get("lat"));
      const lng = parseFloat(params.get("lng"));
      const modo = params.get("modo") || "radio";  // "radio" | "proximidad"
      const radioParam = parseFloat(params.get("radio")) || 10;
      const nParam = parseInt(params.get("n") || "10", 10);
      const sectoresParam = params.get("sectores") || "";
      const sectoresFiltro = sectoresParam
        ? sectoresParam.split("|").filter(Boolean)
        : [];

      const coordsLabel = document.getElementById("coordsLabel");
      const modoLabel = document.getElementById("modoLabel");
      const radioLabel = document.getElementById("radioLabel");
      const countLabel = document.getElementById("countLabel");
      const invLabel = document.getElementById("invLabel");

      coordsLabel.textContent = `Punto: ${lat.toFixed(5)}, ${lng.toFixed(5)}`;
      modoLabel.textContent =
        modo === "proximidad"
          ? `Modo: Proximidad (N=${nParam} aprobados)`
          : `Modo: Radio (R=${radioParam} km)`;

      // Inicializar mapa
      const map = L.map("map", {
        center: [lat, lng],
        zoom: 10,
        minZoom: 4,
      });

      // 🌎 OSM abajo
      const capaOSM = L.tileLayer(
        "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
        {
          opacity: 1.0,
          maxZoom: 19,
          attribution: "&copy; OpenStreetMap contributors"
        }
      ).addTo(map);

      // 🛰️ Satélite arriba (90% transparente)
      const capaSatelite = L.tileLayer(
        "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",
        {
          opacity: 0.10,
          maxZoom: 19
        }
      ).addTo(map);

      L.control.scale().addTo(map);

      // Punto exacto del clic
      L.circleMarker([lat, lng], {
        radius: 6,
        color: "#1d4ed8",
        weight: 2,
        fillColor: "#1d4ed8",
        fillOpacity: 1,
      }).addTo(map);

      const markersLayer = L.layerGroup().addTo(map);

      // Leyenda
      const legend = L.control({ position: "bottomleft" });
      legend.onAdd = function () {
        const div = L.DomUtil.create("div", "legend");
        div.innerHTML = `
          <div class="legend-item">
            <span class="legend-color" style="background:#16a34a;"></span> Aprobado (N más cercanos)
          </div>
          <div class="legend-item">
            <span class="legend-color" style="background:#ea580c;"></span> En calificación / evaluación
          </div>
          <div class="legend-item">
            <span class="legend-color" style="background:#dc2626;"></span> Rechazado
          </div>
          <div class="legend-item">
            <span class="legend-color" style="background:#6b7280;"></span> Otros estados
          </div>
        `;
        return div;
      };
      legend.addTo(map);

      try {
        let proyectos = await loadExcelData();

        // Filtro por sectores (mismos que en index.html)
        if (sectoresFiltro.length) {
          proyectos = proyectos.filter((p) => {
            const sectorLower = (p.sector || "").toLowerCase();
            return sectoresFiltro.some(
              (s) => sectorLower === s.trim().toLowerCase()
            );
          });
        }

        const todosConDist = proyectos.map((p) => ({
          ...p,
          distKm: distanceKm(lat, lng, p.lat, p.lon),
        }));

        let radioKm = radioParam;
        let aprobTopN = [];

        if (modo === "proximidad") {
          // Sólo aprobados, ordenados por distancia
          const aprobados = todosConDist.filter((p) =>
            (p.estado || "").toLowerCase().includes("aprob")
          );
          aprobados.sort((a, b) => a.distKm - b.distKm);

          aprobTopN = aprobados.slice(0, nParam);

          if (aprobTopN.length) {
            radioKm = aprobTopN[aprobTopN.length - 1].distKm;
          } else {
            radioKm = radioParam; // fallback
          }
        }

        // Círculo (sólo perímetro)
        const circle = L.circle([lat, lng], {
          radius: radioKm * 1000,
          color: "#1d4ed8",
          weight: 3,
          fill: false,
          fillOpacity: 0,
          interactive: false,
        }).addTo(map);

        // Ajustar vista
        map.fitBounds(circle.getBounds(), { padding: [20, 20] });

        // Proyectos dentro del radio
        const dentro = todosConDist.filter((p) => p.distKm <= radioKm);

        // Conjunto de aprobados top N (para marcarlos en verde en modo proximidad)
        const topNSet =
          modo === "proximidad"
            ? new Set(
                aprobTopN.map(
                  (p) => `${p.lat}|${p.lon}|${(p.nombre || "").trim()}`
                )
              )
            : new Set();

        // Contadores y sumas de inversión
        let resumenAprob = 0;
        let resumenCalif = 0;
        let resumenRech = 0;
        let resumenOtros = 0;

        let invAprob = 0;
        let invCalif = 0;
        let invRech = 0;
        let invOtros = 0;

        dentro.forEach((p) => {
          const estadoL = (p.estado || "").toLowerCase();
          const key = `${p.lat}|${p.lon}|${(p.nombre || "").trim()}`;

          let color = "#6b7280"; // otros
          let bucket = "Otros";

          if (modo === "proximidad" && topNSet.has(key)) {
            color = "#16a34a"; // Aprobados N más cercanos
            bucket = "Aprob";
          } else if (estadoL.includes("rech")) {
            color = "#dc2626";
            bucket = "Rech";
          } else if (estadoL.includes("calif") || estadoL.includes("eval")) {
            color = "#ea580c";
            bucket = "Calif";
          } else if (estadoL.includes("aprob")) {
            color = "#16a34a";
            bucket = "Aprob";
          }

          // Contadores
          if (bucket === "Aprob") resumenAprob++;
          else if (bucket === "Calif") resumenCalif++;
          else if (bucket === "Rech") resumenRech++;
          else resumenOtros++;

          // Inversión
          if (Number.isFinite(p.inversion)) {
            if (bucket === "Aprob") invAprob += p.inversion;
            else if (bucket === "Calif") invCalif += p.inversion;
            else if (bucket === "Rech") invRech += p.inversion;
            else invOtros += p.inversion;
          }

          const m = L.circleMarker([p.lat, p.lon], {
            radius: 4,
            color,
            weight: 1,
            fillColor: color,
            fillOpacity: 0.8,
          });

          m.bindPopup(`
            <strong>${p.nombre || "Proyecto sin nombre"}</strong><br/>
            <b>Tipo:</b> ${p.tipo || "—"}<br/>
            <b>Sector:</b> ${p.sector || "—"}<br/>
            <b>Inversión:</b> ${formatMMU(p.inversion)}<br/>
            <b>Estado:</b> ${p.estado || "—"}<br/>
            <b>Distancia:</b> ${p.distKm.toFixed(2)} km<br/><br/>
            <b>Expediente:</b> ${
              p.web
                ? `<a href="${p.web}" target="_blank">Abrir expediente</a>`
                : "—"
            }<br/>
            <b>Anexos:</b> ${
              p.anexos
                ? `<a href="${p.anexos}" target="_blank">Abrir anexos</a>`
                : "—"
            }<br/><br/>
            <button onclick="abrirReconsulta(${p.lat}, ${p.lon})"
                    style="padding:6px 10px; cursor:pointer;">
              🔎 Reconsultar desde este proyecto
            </button>
          `);

          m.addTo(markersLayer);
        });

        // Actualizar cinta
        radioLabel.textContent = `Radio: ${radioKm.toFixed(1)} km`;
        countLabel.textContent =
          `Resumen – Aprob: ${resumenAprob} | Calif: ${resumenCalif} | ` +
          `Rech: ${resumenRech} | Otros: ${resumenOtros}`;
        invLabel.textContent =
          `Inversión – Aprob: ${formatMMU(invAprob)} | ` +
          `Calif: ${formatMMU(invCalif)} | ` +
          `Rech: ${formatMMU(invRech)} | ` +
          `Otros: ${formatMMU(invOtros)}`;
      } catch (err) {
        console.error("Error cargando nacional.xlsx en mapainfo.html:", err);
        radioLabel.textContent = "Radio: —";
        countLabel.textContent =
          "Error al cargar datos de proyectos para este detalle.";
        invLabel.textContent = "Inversión: —";
      }
    });

    // Reconsulta desde popup
    function abrirReconsulta(lat, lon) {
      const params = globalParams || new URLSearchParams(window.location.search);
      const modo = params.get("modo") || "radio";
      const radio = params.get("radio") || 10;
      const n = params.get("n") || 10;
      const sectores = params.get("sectores") || "";

      const url = new URL("mapainfo.html", window.location.href);
      url.searchParams.set("lat", lat);
      url.searchParams.set("lng", lon);
      url.searchParams.set("modo", modo);
      url.searchParams.set("radio", radio);
      url.searchParams.set("n", n);
      if (sectores) url.searchParams.set("sectores", sectores);

      window.open(url.toString(), "_blank");
    }
  </script>
</body>
</html>
