<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>SEA Mining - Detalle de proximidad</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="css/mapainfo.css" />
</head>

<body>
  <div class="page-wrapper">
    <header>
      <h1>SEA Mining – Detalle de proximidad</h1>
      <p>Proyectos dentro del radio definido desde el punto consultado.</p>
    </header>

    <div class="info-bar">
      <div class="info-row">
        <span id="coordsLabel">Punto: —</span>
        <span id="modoLabel">Modo: —</span>
        <span id="radioLabel">Radio: —</span>
      </div>

      <div class="info-row">
        <span id="countLabel">Resumen: —</span>
        <span id="invLabel">Inversión: —</span>
      </div>

      <div class="info-actions">
        <button id="btnKmz" type="button" class="btn-kmz">⬇ KMZ</button>
        <button id="btnPdf" type="button" class="btn-kmz" style="background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);">🖨️ PDF</button>
      </div>
    </div>

    <div class="map-container">
      <div class="map-square">
        <!-- ✅ Hint de 2 dedos para móvil -->
        <div id="mapTouchHint" class="map-touch-hint">
          <div class="map-touch-hint-content">
            ✌️ Usa 2 dedos para mover el mapa
          </div>
        </div>
        
        <div id="map"></div>
      </div>

      <div class="projects-panel" id="projectsPanel">
        <div class="panel-header">
          <div class="panel-title">
            <span>📋 Proyectos</span>
            <span class="panel-count" id="panelCount">0</span>
          </div>
        </div>
        <div class="panel-content" id="panelContent"></div>
      </div>
    </div>

    <div id="chartsSection" class="charts-wrapper">
      <h2 class="charts-title">Análisis gráfico de la inversión</h2>
      <div id="chartsGrid" class="charts-grid"></div>
    </div>
  </div>

  <!-- Mobile sheet -->
  <div id="mobileSheetBackdrop" class="mobile-backdrop hidden" aria-hidden="true"></div>
  <section id="mobileSheet" class="mobile-sheet hidden" aria-hidden="true">
    <div class="mobile-sheet__handle" id="mobileSheetHandle"></div>
    <header class="mobile-sheet__header">
      <div class="mobile-sheet__title" id="msTitle">Proyecto</div>
      <button class="mobile-sheet__close" id="msClose" aria-label="Cerrar">✕</button>
    </header>
    <div class="mobile-sheet__meta" id="msMeta"></div>
    <div class="mobile-sheet__actions">
      <a id="msExp" class="ms-btn ms-btn--primary" href="#" target="_blank" rel="noopener">Abrir expediente</a>
      <a id="msAnx" class="ms-btn ms-btn--secondary" href="#" target="_blank" rel="noopener">Abrir anexos</a>
    </div>
  </section>

  <!-- Scripts -->
  <script defer src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script defer src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
  
  <!-- PDF: jsPDF + autoTable -->
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
  
  <!-- Captura de mapa: dom-to-image (SIN problemas de CORS) -->
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/dom-to-image/2.6.0/dom-to-image.min.js"></script>

  <script defer src="js/graficos.js"></script>
  <script type="module" src="js/mapainfo.js"></script>
</body>
</html>
