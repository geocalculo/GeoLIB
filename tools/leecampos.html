<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Vista UTM SEA_Atacama_Proyectos.xlsx</title>

  <!-- SheetJS -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <!-- Proj4 para conversiones UTM -->
  <script src="https://cdn.jsdelivr.net/npm/proj4@2.9.0/dist/proj4.js"></script>

  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
        Roboto, Helvetica, Arial, sans-serif;
      padding: 1.5rem;
      font-size: 0.85rem;
    }
    h2 {
      margin-top: 0;
    }
    table {
      border-collapse: collapse;
      margin-top: 1rem;
      width: 100%;
      max-width: 100%;
    }
    th, td {
      border: 1px solid #ccc;
      padding: 3px 5px;
      text-align: left;
      vertical-align: top;
    }
    th {
      background-color: #f3f4f6;
      position: sticky;
      top: 0;
      z-index: 1;
    }
    .small {
      font-size: 0.8rem;
      color: #555;
    }
    .error {
      background-color: #fee2e2;
    }
  </style>
</head>
<body>

  <h2>Campos y UTM del archivo XLSX</h2>
  <p class="small">Archivo: <b>capas/SEA_Atacama_Proyectos.xlsx</b></p>

  <div id="info"></div>
  <div style="overflow:auto; max-height:75vh;">
    <table id="tabla"></table>
  </div>

  <script>
    const url = "../capas/SEA_Atacama_Proyectos.xlsx";

    // ---- Helpers ----
    function normalizeHeader(h) {
      return String(h || "")
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .toLowerCase();
    }

    function parseCoord(value) {
      if (value === null || value === undefined) return null;
      let s = String(value).trim();
      if (!s) return null;
      s = s.replace(",", "."); // coma decimal -> punto
      const n = Number(s);
      return isNaN(n) ? null : n;
    }

    function calcZoneFromLon(lon) {
      // huso UTM estándar
      return Math.floor((lon + 180) / 6) + 1;
    }

    async function cargarArchivo() {
      const infoDiv = document.getElementById("info");
      const tabla = document.getElementById("tabla");

      try {
        const response = await fetch(url);
        if (!response.ok) {
          infoDiv.textContent = "No se pudo cargar el archivo XLSX.";
          return;
        }

        const data = await response.arrayBuffer();
        const workbook = XLSX.read(data, { type: "array" });

        const sheetName = workbook.SheetNames[0];
        const sheet = workbook.Sheets[sheetName];

        const arr = XLSX.utils.sheet_to_json(sheet, { header: 1, defval: "" });
        if (!arr.length) {
          infoDiv.textContent = "La hoja está vacía.";
          return;
        }

        const headers = arr[0];
        const rows = arr.slice(1);

        // Detectar columnas de lat/lon por nombre
        let latIdx = -1;
        let lonIdx = -1;
        headers.forEach((h, idx) => {
          const n = normalizeHeader(h);
          if (n.includes("latitud") && latIdx === -1) latIdx = idx;
          if (n.includes("longitud") && lonIdx === -1) lonIdx = idx;
        });

        infoDiv.innerHTML =
          `<div class="small">
             Hoja: <b>${sheetName}</b> &mdash; 
             Campos: <b>${headers.length}</b> &mdash; 
             Registros: <b>${rows.length}</b><br>
             Índice latitud: <b>${latIdx}</b> &mdash; 
             Índice longitud: <b>${lonIdx}</b>
           </div>`;

        // Definir sistema geográfico WGS84 para proj4
        proj4.defs("WGS84", "+proj=longlat +datum=WGS84 +no_defs");

        // Construir tabla
        const thead = document.createElement("thead");
        const trHead = document.createElement("tr");

        headers.forEach(h => {
          const th = document.createElement("th");
          th.textContent = h;
          trHead.appendChild(th);
        });

        // Agregar columnas UTM al final
        const thEste = document.createElement("th");
        thEste.textContent = "Este_UTM";
        trHead.appendChild(thEste);

        const thNorte = document.createElement("th");
        thNorte.textContent = "Norte_UTM";
        trHead.appendChild(thNorte);

        thead.appendChild(trHead);

        const tbody = document.createElement("tbody");

        rows.forEach(row => {
          const tr = document.createElement("tr");

          headers.forEach((_, colIdx) => {
            const td = document.createElement("td");
            td.textContent = row[colIdx] !== undefined ? row[colIdx] : "";
            tr.appendChild(td);
          });

          let esteText = "";
          let norteText = "";

          if (latIdx >= 0 && lonIdx >= 0) {
            const lat = parseCoord(row[latIdx]);
            const lon = parseCoord(row[lonIdx]);

            if (lat != null && lon != null) {
              try {
                const zone = calcZoneFromLon(lon);
                const utmDef = `+proj=utm +zone=${zone} +south +datum=WGS84 +units=m +no_defs`;

                const result = proj4("WGS84", utmDef, [lon, lat]);
                const este = result[0];
                const norte = result[1];

                esteText = este.toFixed(2);
                norteText = norte.toFixed(2);
              } catch (e) {
                esteText = "ERR";
                norteText = "ERR";
                tr.classList.add("error");
              }
            } else {
              // no se pudo parsear lat/lon
              tr.classList.add("error");
            }
          } else {
            tr.classList.add("error");
          }

          const tdEste = document.createElement("td");
          tdEste.textContent = esteText;
          tr.appendChild(tdEste);

          const tdNorte = document.createElement("td");
          tdNorte.textContent = norteText;
          tr.appendChild(tdNorte);

          tbody.appendChild(tr);
        });

        tabla.innerHTML = "";
        tabla.appendChild(thead);
        tabla.appendChild(tbody);

      } catch (err) {
        console.error(err);
        infoDiv.textContent = "Error leyendo el XLSX en el navegador.";
      }
    }

    cargarArchivo();
  </script>

</body>
</html>
